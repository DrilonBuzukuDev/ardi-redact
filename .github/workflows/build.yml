name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - run: go test -race ./internal/...
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          wails build -tags webkit2_41
          bash scripts/package-linux.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: wails build -nsis
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          wails build
          ditto -c -k --keepParent 'build/bin/Ardi Redact.app' build/bin/ardi-redact-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ardi-redact-${{ runner.os }}
          path: |
            build/bin/*.deb
            build/bin/*installer.exe
            build/bin/*.zip
          if-no-files-found: error
